<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paste Excel Data</title>
    <!-- Glide Data Grid CSS -->
    <link rel="stylesheet" href="https://unpkg.com/@glideapps/glide-data-grid/dist/index.css">
    <link href="/resources/paste-data.css" rel="stylesheet">
</head>
<body>
    <div class="container">
        
        <div class="section">
            <button onclick="pasteFromClipboard()" style="background-color: #2196F3; margin-top: 0;">Coller depuis le presse-papier</button>
            <button onclick="processData()" style="background-color: #1ccd5a;">Lancer la simulation</button>
            <button class="secondary" onclick="clearTable()">Tout effacer</button>
        </div>
        
        <div class="section">
            <div id="gridContainer"></div>
        </div>
        
        
        <div class="section" id="resultsSection" style="display: none;">
            <pre id="resultsContent" style="background-color: #f0f0f0; padding: 15px; border-radius: 4px; overflow-x: auto;"></pre>
            <!-- <button onclick="clearResults()" class="secondary">Clear Results</button> -->
        </div>
    </div>

    <!-- Glide Data Grid JS -->
    <script src="https://unpkg.com/@glideapps/glide-data-grid"></script>
    <script src="/resources/paste-data.js"></script>
</body>
</html>
